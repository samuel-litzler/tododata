# =============================================================================
# nexus-analytics — PostgreSQL 17 / PostGIS 3.5
# Profil : INGESTION MASSIVE sur machine de dev partagée (WSL2).
# =============================================================================
# Contexte de dimensionnement (relevé le 2026-08-14) :
#   - Host : 34 Gi RAM totale, ~6 Gi réellement disponibles (28 Gi déjà pris par
#     todoride-*, cvc-*, valhalla, photon, open-meteo) + 18 Gi de swap actif.
#   - 16 vCPU, 746 Go libres sur /.
# On vise donc un Postgres SOBRE en RAM mais AGRESSIF en I/O séquentielles :
# le goulot d'étranglement de ce projet, ce sont les COPY massifs et les
# CREATE INDEX GIST, pas la concurrence (un seul worker ETL à la fois).
#
# Pour un run lourd (parcelles) quand les autres services sont arrêtés,
# basculer sur le profil "heavy" : voir infra/docker/postgresql.heavy.conf
# et relancer avec COMPOSE_PG_CONF=postgresql.heavy.conf.
# =============================================================================

data_directory = '/var/lib/postgresql/data'
listen_addresses = '*'
port = 5432
max_connections = 40                    # 1 worker ETL + psql + API : inutile de monter

# --- Mémoire -----------------------------------------------------------------
shared_buffers = 2GB                    # ~17% du mem_limit (12g) : volontairement en
                                        # dessous du quart usuel, la machine est
                                        # partagée et shared_buffers est une
                                        # allocation RÉELLE, pas un plafond.
effective_cache_size = 6GB              # hint au planner : ce que l'OS peut cacher
work_mem = 96MB                         # ST_Difference / tris géométriques par nœud.
                                        # 40 conn x 96MB serait fatal, mais on n'aura
                                        # jamais >3 requêtes lourdes concurrentes ici.
maintenance_work_mem = 1GB              # CREATE INDEX GIST : le paramètre #1 du projet
                                        # 3 départements de front = 3 Go en pointe,
                                        # d'où le refus de monter plus haut.
autovacuum_work_mem = 256MB

# --- Écriture / WAL ----------------------------------------------------------
# Les données sont 100% dérivées de sources publiques et rejouables : on privilégie
# le débit d'ingestion sur la durabilité. Une perte de transaction = on relance le job.
wal_level = minimal                     # pas de réplication : permet aussi le COPY
max_wal_senders = 0                     #   non-journalisé sur table créée dans la même tx
synchronous_commit = off
full_page_writes = on
wal_compression = zstd
max_wal_size = 12GB                     # évite un checkpoint toutes les 30s pendant un COPY
min_wal_size = 2GB
checkpoint_timeout = 20min
checkpoint_completion_target = 0.9

# --- Parallélisme ------------------------------------------------------------
# Plafond global aligné sur les 12 coeurs alloués au container. Le run national
# traite 3 départements de front, chacun s'autorisant 2 workers par nœud (réglage
# local dans parc.distiller) : on reste sous le plafond même en pointe.
max_worker_processes = 12
max_parallel_workers = 10
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4    # accélère nettement les CREATE INDEX

# --- Planner (stockage SSD/NVMe) ---------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200         # géométries : distributions très irrégulières

# --- Autovacuum --------------------------------------------------------------
# Tables d'ingestion = gros INSERT en masse puis lecture seule. On veut que
# l'ANALYZE suive vite pour ne pas planifier sur des stats vides.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 4

# --- Logs --------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 5000       # tout ce qui dépasse 5s (audit des requêtes géo)
log_checkpoints = on
log_autovacuum_min_duration = 10000
log_lock_waits = on
log_temp_files = 64MB                   # révèle un work_mem trop bas
log_line_prefix = '%m [%p] %q%u@%d '

# --- Divers ------------------------------------------------------------------
timezone = 'Europe/Paris'
lc_messages = 'C'
datestyle = 'iso, dmy'
statement_timeout = 0                   # certains ST_Union départementaux durent >1h
idle_in_transaction_session_timeout = 3600000   # 1h : coupe les tx ETL zombies
